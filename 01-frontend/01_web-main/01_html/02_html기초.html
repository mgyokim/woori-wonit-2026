<!DOCTYPE html>
<!-- lang="ko" : 문서 언어 선언. 스크린리더 발음과 브라우저 번역 판단의 기준이 됨 -->
<html lang="ko">
<head>
    <!-- charset : 없으면 브라우저가 인코딩을 추측해서 한글이 깨짐. head 최상단에 둘 것 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계좌 카드 구조</title>
</head>
<body>

<!-- ==========================================================
     실습 — AI에게 "구조만" 시켜서 만든 계좌 카드
     제약 : CSS 없이 HTML 구조만 / 시맨틱 태그 우선
     ========================================================== -->

<!-- article : 카드 한 장이 그 자체로 완결된 독립 콘텐츠라서. 다른 화면에 그대로 옮겨도 말이 됨 -->
<article>

    <!-- header : 카드의 머리말. "어느 은행 계좌인지" 식별하는 정보를 묶는 자리 -->
    <header>
        <!-- h2 : 카드의 제목. 페이지 제목(h1) 아래 계층이므로 h1이 아니라 h2 -->
        <h2>우리은행</h2>
    </header>

    <!-- dl : "이름 - 값" 쌍이 반복되는 구조라 정의 목록이 정확함. table은 행과 열이 있는 2차원 데이터용 -->
    <dl>
        <!-- dt : 값에 붙는 이름표 -->
        <dt>계좌번호</dt>
        <!-- dd : dt에 대응하는 값. 가운데를 가린 마스킹 텍스트는 '화면 표시용' -->
        <dd>1002-***-678901</dd>

        <dt>잔액</dt>
        <!-- data : 사람이 읽는 "1,523,000원"과 기계가 읽는 원 단위 정수(value)를 같이 담을 수 있음 -->
        <dd><data value="1523000">1,523,000원</data></dd>
    </dl>

    <!-- footer : 본문에 딸린 보조 영역. 이 카드에 대한 행동 버튼을 모음 -->
    <footer>
        <!-- button : 다른 문서로 가는 게 아니라 '동작'을 일으키므로 a가 아니라 button -->
        <!-- type="button" : 생략하면 form 안에서 submit으로 동작해 폼이 전송되는 사고가 남 -->
        <button type="button">이체</button>
        <button type="button">상세</button>
    </footer>

</article>

</body>
</html>
