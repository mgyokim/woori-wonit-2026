<!DOCTYPE html>
<!-- lang="ko" : 문서 언어 선언. 스크린리더 발음과 브라우저 번역 판단의 기준이 됨 -->
<html lang="ko">
<head>
    <!-- charset : 없으면 브라우저가 인코딩을 추측해서 한글이 깨짐. head 최상단에 둘 것 -->
    <meta charset="UTF-8">
    <!-- viewport : 없으면 모바일 브라우저가 PC 기준(980px)으로 그린 뒤 축소해서 보여준다.
         375px 기준으로 만든 이 화면도 깨알같이 작아진다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계좌 카드</title>
    <!-- 구조(HTML)와 표현(CSS)의 분리. style 속성이나 style 태그 대신 외부 파일로 뺐다 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==========================================================
     실습 ① + ② — 구조는 HTML, 인테리어는 CSS
     ① 시맨틱 태그로 계좌 카드 구조 만들기
     ② 박스모델(padding · margin · border)과 Flexbox로 스타일 입히기
     ========================================================== -->

<!-- main : 이 페이지의 주된 내용. 카드 목록을 감싸는 자리 -->
<main class="account-list">

    <!-- h1 : 페이지의 제목. 카드 제목(h2)보다 한 단계 위 -->
    <h1 class="account-list__title">내 계좌</h1>

    <!-- article : 카드 한 장이 그 자체로 완결된 독립 콘텐츠라서.
         다른 화면에 그대로 옮겨도 말이 됨 -->
    <article class="account-card">

        <!-- header : 카드의 머리말. "어느 은행 계좌인지" 식별하는 정보를 묶는 자리 -->
        <header class="account-card__head">
            <!-- h2 : 카드의 제목. 페이지 제목(h1) 아래 계층이므로 h1이 아니라 h2 -->
            <h2 class="account-card__bank">우리은행</h2>
            <!-- p : 계좌의 별칭. 제목이 아니라 부연 설명이라 h3가 아닌 p -->
            <p class="account-card__alias">월급통장</p>
        </header>

        <!-- dl : "이름 - 값" 쌍이 반복되는 구조라 정의 목록이 정확함.
             table은 행과 열이 있는 2차원 데이터용 -->
        <dl class="account-card__info">
            <!-- dt : 값에 붙는 이름표 -->
            <dt class="account-card__label">계좌번호</dt>
            <!-- dd : dt에 대응하는 값. 가운데를 가린 마스킹 텍스트는 '화면 표시용' -->
            <dd class="account-card__number">1002-***-678901</dd>

            <dt class="account-card__label">잔액</dt>
            <dd class="account-card__balance">
                <!-- data : 사람이 읽는 "1,523,000원"과
                     기계가 읽는 원 단위 정수(value)를 같이 담을 수 있음 -->
                <data value="1523000">1,523,000</data><span class="account-card__unit">원</span>
            </dd>
        </dl>

        <!-- footer : 본문에 딸린 보조 영역. 이 카드에 대한 행동 버튼을 모음 -->
        <footer class="account-card__actions">
            <!-- button : 다른 문서로 가는 게 아니라 '동작'을 일으키므로 a가 아니라 button -->
            <!-- type="button" : 생략하면 form 안에서 submit으로 동작해 폼이 전송되는 사고가 남 -->
            <button type="button" class="btn btn--primary">이체</button>
            <button type="button" class="btn btn--ghost">상세</button>
        </footer>

    </article>

    <!-- 카드가 여러 장일 때 margin 이 어떻게 동작하는지 보려고 한 장 더 둠 -->
    <article class="account-card">

        <header class="account-card__head">
            <h2 class="account-card__bank">우리은행</h2>
            <p class="account-card__alias">비상금</p>
        </header>

        <dl class="account-card__info">
            <dt class="account-card__label">계좌번호</dt>
            <dd class="account-card__number">1002-***-004312</dd>

            <dt class="account-card__label">잔액</dt>
            <dd class="account-card__balance">
                <data value="380500">380,500</data><span class="account-card__unit">원</span>
            </dd>
        </dl>

        <footer class="account-card__actions">
            <button type="button" class="btn btn--primary">이체</button>
            <button type="button" class="btn btn--ghost">상세</button>
        </footer>

    </article>

</main>

</body>
</html>
